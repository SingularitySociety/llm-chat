# Minimal Node.js CI — runs lint / build / test on pull_request + push
# to master. Modeled on the mulmocast-cli pattern (single job matrix,
# yarn cache, no OS matrix).

name: Node.js CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  lint_test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    steps:
    - uses: actions/checkout@v5
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v5
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'yarn'
    - name: Cache node_modules
      uses: actions/cache@v5
      with:
        path: node_modules
        key: node-modules-${{ matrix.node-version }}-${{ hashFiles('yarn.lock') }}
    - run: yarn install --frozen-lockfile
    - name: Write stub src/config/project.ts for CI build
      run: |
        mkdir -p src/config
        cat > src/config/project.ts <<'EOF'
        export const firebaseConfig = {
          apiKey: "stub",
          authDomain: "stub",
          projectId: "stub",
          storageBucket: "stub",
          messagingSenderId: "stub",
          appId: "stub",
        };
        export const appCheckKey = "stub";
        export const specialUid: string[] = [];
        export const chatCreationlimit = 0;
        export const messageCreationlimit = 0;
        EOF
    - run: yarn run lint
    - run: yarn run build
